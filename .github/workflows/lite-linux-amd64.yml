name: lite-linux-amd64

# One-off build of WeKnora Lite as a *statically linked* linux/amd64 binary,
# packaged in the layout the TMAgentSpace docker build wants.
#
# Why static: the target runtime is Huawei Cloud EulerOS 2.0 (glibc 2.34). A
# normal cgo build on ubuntu-latest references GLIBC_2.38 / __isoc23_* and
# dies at exec time on the older runtime (measured: 2026-11-10).
# Go's osusergo/netgo tags + -extldflags -static remove the need for the
# target's glibc/NSS entirely.
#
# Why CI: cross-compiling CGO for linux from the Windows laptop fails (the Go
# toolchain crashes in CreateProcess under that host's EDR), and the repo's
# release-lite.yml pins GOTOOLCHAIN=local with Go 1.24, which cannot satisfy
# go.mod's go 1.26.0.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install sqlite headers (sqlite-vec cgo needs sqlite3.h)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          ls -la /usr/include/sqlite3.h

      - name: Build Lite binary (linux/amd64, static, cgo)
        run: |
          set -eux
          SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GOVER=$(go version | awk '{print $3}')
          LDFLAGS="-w -s \
            -X=github.com/Tencent/WeKnora/internal/handler.Version=0.9.0 \
            -X=github.com/Tencent/WeKnora/internal/handler.Edition=lite \
            -X=github.com/Tencent/WeKnora/internal/handler.CommitID=${SHA} \
            -X=github.com/Tencent/WeKnora/internal/handler.BuildTime=${BUILT_AT} \
            -X=github.com/Tencent/WeKnora/internal/handler.GoVersion=${GOVER} \
            -linkmode=external -extldflags=-static"
          go build -tags "sqlite_fts5 netgo osusergo" -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o WeKnora-lite ./cmd/server
          file WeKnora-lite
          ls -la WeKnora-lite
          sha256sum WeKnora-lite

      - name: Package artifact
        run: |
          set -eux
          rm -rf pkg
          mkdir -p pkg/web pkg/migrations/sqlite
          cp WeKnora-lite pkg/
          cp -r frontend/dist/* pkg/web/
          cp -r config pkg/config
          cp -r migrations/sqlite/* pkg/migrations/sqlite/
          cp .env.lite.example pkg/
          cp docs/LITE.md pkg/README.md || true
          tar czf weknora-lite-linux-amd64.tar.gz -C pkg .
          ls -la
          du -h weknora-lite-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: weknora-lite-linux-amd64
          path: weknora-lite-linux-amd64.tar.gz
          retention-days: 3
